# EXAMPLE ONLY - do not commit real values.
# Jenkins creates this Secret automatically; to create it manually use:
#   kubectl create secret generic attendease-secret \
#     --from-literal=MONGODB_URI='...' --from-literal=JWT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: attendease-secret
type: Opaque
stringData:
  MONGODB_URI: "your_mongodb_atlas_connection_string"
  JWT_SECRET: "your_long_random_string"
